<style>
/* ---------- PAIR: "Senin / En İyi Çiftin" ----------
   Ölçüler referanstan: sayfa genişliği 560px baz alınarak (ref sayfa 732px @3x → ×0.765). */
.pair{position:relative;z-index:2;overflow:hidden;background:#fff;padding:44px 0 42px;text-align:center}
.pair-kicker{display:block;font-family:var(--serif);font-size:32px;font-weight:700;line-height:1;color:var(--dark);letter-spacing:0}
.pair-title{font-family:var(--serif);font-size:70px;font-weight:700;line-height:1;margin-top:0;color:var(--dark);letter-spacing:.006em}

.pair-cards{display:flex;justify-content:center;gap:45px;margin-top:49px;position:relative}
.pair-card{position:relative;width:213px;height:251px;flex:0 0 213px;border-radius:15px;text-align:center;
  background:
    radial-gradient(90% 60% at 50% -10%,rgba(255,255,255,.22),rgba(255,255,255,0) 60%),
    linear-gradient(180deg,#fadb24 0%,#f8d41c 50%,#f5cc12 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(180,130,0,.14)}
.pair-name{position:absolute;left:0;right:0;top:36px;font-family:var(--serif);font-weight:700;font-size:26px;line-height:1;color:var(--dark);letter-spacing:.004em}
.pair-dots{position:absolute;left:0;right:0;top:88px;display:flex;justify-content:center;gap:13px}
.pair-dots i{width:21px;height:21px;border-radius:50%;display:block;
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.22),inset 0 1px 2px rgba(255,255,255,.14)}
.pair-dots i:nth-child(1){background:radial-gradient(circle at 38% 32%,#ad6a34,#965223 55%,#7a3f14)}
.pair-dots i:nth-child(2){background:radial-gradient(circle at 38% 32%,#844027,#652c19 55%,#4a1c0f)}
.pair-dots i:nth-child(3){background:radial-gradient(circle at 38% 32%,#2e2d2b,#0d0d0d 55%,#000)}
.pair-dots i:nth-child(4){background:radial-gradient(circle at 38% 32%,#d19453,#ba7b36 55%,#9a5f22)}
.pair-tag{position:absolute;left:12px;right:12px;bottom:22px;height:40px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#232220 0%,#111010 55%,#050504 100%);color:#fff;
  font-family:var(--serif);font-weight:700;font-size:18px;line-height:1;letter-spacing:.004em;
  box-shadow:0 5px 12px rgba(0,0,0,.16)}
.pair-shoe{position:absolute;max-width:none;z-index:2;pointer-events:none;
  filter:drop-shadow(0 8px 7px rgba(0,0,0,.34)) drop-shadow(0 2px 3px rgba(0,0,0,.22))}
/* sol kart (ref: alçak oxford, etiketin ALTINDA durur; burun kartın sağ kenarına değer, alt kenar kartın 69px altında) */
.pair-card:nth-child(1) .pair-shoe{width:176px;left:-18px;bottom:-73px}
.pair-card:nth-child(1) .pair-tag{padding-left:14px}
/* sağ kart (ref: bot etiketin sağ ucunu örter, sağ kenardan ~36px taşar, alt kenar kartın 80px altında) */
.pair-card:nth-child(2) .pair-shoe{width:256px;left:-1px;bottom:-84px}
.pair-card:nth-child(2) .pair-tag{padding-right:8px}

.pair-cta{margin-top:128px}
.pair .btn{width:311px;height:62px;padding:0 26px;justify-content:center;border-radius:13px;font-size:21px;font-weight:500;
  border-width:1.5px;border-color:rgba(27,20,16,.72);color:var(--dark);gap:.3em;letter-spacing:.012em}
.pair .btn::after{content:"➜";font-size:21px;line-height:1;font-weight:700;transform:translateY(.02em)}
</style>
<section data-sec="pair" class="pair" id="koleksiyon">
  <span class="pair-kicker rv">Senin</span>
  <h2 class="pair-title rv">En İyi Çiftin</h2>

  <div class="pair-cards rv">
    <article class="pair-card">
      <h3 class="pair-name">Chelsea Bot</h3>
      <div class="pair-dots" aria-label="Renk seçenekleri"><i></i><i></i><i></i><i></i></div>
      <span class="pair-tag">Siyah Deri</span>
      <img class="pair-shoe" src="assets/cut-sag.webp" alt="Siyah deri Chelsea bot, yan görünüm" loading="lazy">
    </article>
    <article class="pair-card">
      <h3 class="pair-name">Chelsea Bot</h3>
      <div class="pair-dots" aria-label="Renk seçenekleri"><i></i><i></i><i></i><i></i></div>
      <span class="pair-tag">Kalın Taban</span>
      <img class="pair-shoe" src="assets/cut-sol.webp" alt="Kalın tabanlı siyah Chelsea bot, karşı yan görünüm" loading="lazy">
    </article>
  </div>

  <div class="pair-cta rv"><a class="btn" href="#siparis">Koleksiyonu Gör</a></div>
</section>
