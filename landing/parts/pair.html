<style>
/* ---------- PAIR: "Senin / En İyi Çiftin" ---------- */
.pair{position:relative;overflow:hidden;background:#fff;padding:46px 0 40px;text-align:center}
.pair-kicker{display:block;font-size:26px;font-weight:800;line-height:1;color:#1b1410}
.pair-title{font-size:71px;line-height:1;margin-top:4px;color:#1b1410;letter-spacing:-.005em}

.pair-cards{display:flex;justify-content:center;gap:45px;padding:0 43px;margin-top:46px;position:relative}
.pair-card{position:relative;width:214px;height:254px;flex:0 0 214px;border-radius:21px;text-align:center;
  background:
    radial-gradient(90% 60% at 50% -10%,rgba(255,255,255,.28),rgba(255,255,255,0) 60%),
    linear-gradient(180deg,#fbda2a 0%,#f8d41c 45%,#f5cb12 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(180,130,0,.15)}
.pair-name{position:absolute;left:0;right:0;top:36px;font-family:var(--serif);font-weight:700;font-size:25px;line-height:1;color:#1b1410;letter-spacing:-.005em}
.pair-dots{position:absolute;left:0;right:0;top:88px;display:flex;justify-content:center;gap:11px}
.pair-dots i{width:23px;height:23px;border-radius:50%;display:block;
  box-shadow:inset 0 -3px 4px rgba(0,0,0,.28),inset 0 2px 3px rgba(255,255,255,.18)}
.pair-dots i:nth-child(1){background:radial-gradient(circle at 35% 30%,#b06a35,#8e4e1f 60%,#73390f)}
.pair-dots i:nth-child(2){background:radial-gradient(circle at 35% 30%,#8a4a2a,#652c19 60%,#4a1c0f)}
.pair-dots i:nth-child(3){background:radial-gradient(circle at 35% 30%,#3a3a38,#121211 60%,#000);outline:2px solid #fff;outline-offset:0}
.pair-dots i:nth-child(4){background:radial-gradient(circle at 35% 30%,#d49a5a,#bb7b37 60%,#9a5f22)}
.pair-tag{position:absolute;left:10px;right:10px;top:188px;height:42px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#232220 0%,#121110 55%,#050504 100%);color:#fff;
  font-family:var(--serif);font-weight:700;font-size:21px;line-height:1;letter-spacing:.005em;
  box-shadow:0 6px 14px rgba(0,0,0,.18)}
.pair-shoe{position:absolute;max-width:none;bottom:-84px;z-index:2;pointer-events:none;
  filter:drop-shadow(0 8px 7px rgba(0,0,0,.34)) drop-shadow(0 2px 3px rgba(0,0,0,.22))}
.pair-card:nth-child(1) .pair-shoe{width:258px;right:-7px}
.pair-card:nth-child(2) .pair-shoe{width:268px;left:-7px}
/* bot sapı etiketin bir ucunu örttüğü için yazıyı görünür tarafa kaydır */
.pair-card:nth-child(1) .pair-tag{padding-left:58px}
.pair-card:nth-child(2) .pair-tag{padding-right:40px}

.pair-cta{margin-top:124px}
.pair .btn{padding:0 44px;height:64px;border-radius:14px;font-size:23px;font-weight:500;border-width:1.5px;border-color:#1b1410;gap:12px}
.pair .btn::after{font-size:22px}
</style>
<section data-sec="pair" class="pair" id="koleksiyon">
  <span class="h-xs pair-kicker rv">Senin</span>
  <h2 class="h-lg pair-title rv">En İyi Çiftin</h2>

  <div class="pair-cards rv">
    <article class="pair-card">
      <h3 class="pair-name">Chelsea Bot</h3>
      <div class="pair-dots" aria-label="Renk seçenekleri"><i></i><i></i><i></i><i></i></div>
      <span class="pair-tag">Siyah Deri</span>
      <img class="pair-shoe" src="assets/cut-sag.webp" alt="Siyah deri Chelsea bot, yan görünüm" loading="lazy">
    </article>
    <article class="pair-card">
      <h3 class="pair-name">Chelsea Bot</h3>
      <div class="pair-dots" aria-label="Renk seçenekleri"><i></i><i></i><i></i><i></i></div>
      <span class="pair-tag">Kalın Taban</span>
      <img class="pair-shoe" src="assets/cut-sol.webp" alt="Kalın tabanlı siyah Chelsea bot, karşı yan görünüm" loading="lazy">
    </article>
  </div>

  <div class="pair-cta rv"><a class="btn" href="#siparis">Koleksiyonu Gör</a></div>
</section>
